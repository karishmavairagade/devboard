apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devboard
  region: us-east-1

iam:
  withOIDC: true

managedNodeGroups:
  - name: ng-default
    instanceType: tc7i-flex.large
    desiredCapacity: 3
    minSize: 2
    maxSize: 3
    volumeSize: 20   # GiB, root disk per node
    ssh:
      enableSsm: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
  - name: metrics-server
